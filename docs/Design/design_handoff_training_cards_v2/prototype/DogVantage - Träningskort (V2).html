<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DogVantage · Träningskort (Variant 2)</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --color-bg: #faf8f4; --color-bg-alt: #f2ede5; --color-surface: #ffffff;
    --color-primary: #2d6a4f; --color-primary-dark: #1b4332; --color-primary-light: #52b788;
    --color-accent: #f4a261; --color-accent-light: #fde8d4;
    --color-green-50: #edf8f2; --color-green-100: #d8f0e5;
    --color-text: #1c1917; --color-text-muted: #5c5752; --color-border: #e7e0d8; --color-error: #d62828;
    --shadow-sm: 0 2px 12px rgb(0 0 0 / 0.08); --shadow-md: 0 4px 16px rgb(0 0 0 / 0.1); --shadow-lg: 0 8px 32px rgb(0 0 0 / 0.12);
    --shadow-primary: 0 4px 16px rgb(45 106 79 / 0.35); --shadow-accent: 0 4px 16px rgb(244 162 97 / 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; color: var(--color-text);
    background:
      radial-gradient(1100px 700px at 50% -10%, #eef5f0 0%, transparent 60%),
      linear-gradient(180deg, #f3f1ec 0%, #ece7df 100%);
    min-height: 100vh;
  }
  button { font-family: inherit; }
  @keyframes dv-pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08);opacity:1} 100%{transform:scale(1);opacity:1} }
  @keyframes dv-float { 0%{transform:translate(-50%,0);opacity:1} 100%{transform:translate(-50%,-42px);opacity:0} }
  @keyframes dv-burst { 0%{transform:translate(-50%,-50%) scale(1);opacity:1} 100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(.4);opacity:0} }

  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 40px 20px 56px; }
  .cap { text-align: center; max-width: 460px; }
  .cap h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; color: var(--color-text); }
  .cap p { margin: 8px 0 0; font-size: 14px; line-height: 1.55; color: var(--color-text-muted); }
  .hints { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--color-primary);
          background: rgba(45,106,79,0.08); border: 1px solid var(--color-green-100); border-radius: 999px; padding: 6px 12px; }
  .device-wrap { transform-origin: top center; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="22" fill="#1b4332"/>
    <circle cx="50" cy="48" r="22" fill="none" stroke="#52b788" stroke-width="6"/>
    <path d="M50 30a22 22 0 0 1 19 11" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M42 48l6 6 11-12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="ex-shared.jsx"></script>
<script type="text/babel" src="ex-variant2.jsx"></script>
<script type="text/babel" src="ex-log2.jsx"></script>
<script type="text/babel" src="ex-v2-flow.jsx"></script>

<script type="text/babel">
  function Page() {
    return (
      <div className="stage">
        <div className="cap">
          <h1>Träningskort · Bold ring</h1>
          <p>Logga varje rep med ett tryck — ✓ Lyckad eller ✗ Miss. Ringen fylls, streaken växer och passet firas när det är klart.</p>
          <div className="hints">
            <span className="hint"><Ph name="check" weight="bold" size={13} /> Tryck ✓ / ✗ per rep</span>
            <span className="hint"><Ph name="fire" weight="fill" size={13} color="#f59e0b" /> Combo vid svit</span>
            <span className="hint"><Ph name="lightning" weight="fill" size={13} color="#f59e0b" /> Sätt svarstid</span>
          </div>
        </div>
        <div className="device-wrap">
          <IOSDevice width={402} height={874}><V2Flow /></IOSDevice>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
